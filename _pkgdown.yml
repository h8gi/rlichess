url: https://h8gi.github.io/rlichess/
template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]

reference:
  - title: "Authentication"
    desc: "Manage Personal API access tokens for authenticated requests."
    contents:
      - lic_token

  - title: "API Clients: Games"
    desc: "Direct interfaces to the Lichess Games API (HTTP requests)."
    contents:
      - lic_games_user
      - lic_game

  - title: "API Clients: Users & Ratings"
    desc: "Direct interfaces to the Lichess Users and Ratings API (HTTP requests)."
    contents:
      - lic_user
      - lic_user_perfs
      - lic_user_rating_history
      - lic_user_perf_stats

  - title: "API Clients: Opening Explorer"
    desc: "Direct interfaces to the Lichess and Masters Opening Explorer databases."
    contents:
      - lic_explorer_lichess
      - lic_explorer_masters
      - lic_explorer_player

  - title: "API Clients: Puzzles"
    desc: "Direct interfaces to the Lichess Puzzles API."
    contents:
      - lic_puzzle_daily
      - lic_puzzle_activity

  - title: "Tidy Wranglers (Offline Transformation)"
    desc: "Offline data manipulation functions that unnest, standardize, and format chess data into tidy tibbles."
    contents:
      - lic_tidy_games
      - lic_tidy_moves
      - lic_normalize_games

  - title: "Chess Analytics (Offline Statistics)"
    desc: "Offline analysis tools to summarize win rates, repertoire performance, and tactical metrics."
    contents:
      - lic_stats_openings
      - lic_stats_opponents
      - lic_stats_time
      - lic_stats_clocks

  - title: "Package Datasets"
    desc: "Built-in datasets included with the package."
    contents:
      - lichess_openings
