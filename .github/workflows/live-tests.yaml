# Live API Integration Tests
# Runs integration tests against the live Lichess API to detect upstream schema drift.
# Triggered manually (workflow_dispatch) or automatically when releasing a new version tag (push: tags).

name: Live API Tests

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions: read-all

jobs:
  live-tests:
    runs-on: ubuntu-latest

    name: Live Lichess API Tests (Ubuntu / R Release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LICHESS_API_TOKEN: ${{ secrets.LICHESS_API_TOKEN }}
      LICHESS_TEST_LIVE: "true"
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
          needs: check

      - name: Run Live API Integration Tests
        run: |
          Rscript -e "pkgload::load_all(); testthat::test_file('tests/testthat/test-live-api.R', stop_on_failure = TRUE)"
